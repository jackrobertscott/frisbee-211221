[package]
name = "frisbee"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.22"
bcrypt = "0.19.3"
bson = { version = "3.1.0", features = ["serde", "serde_json-1"] }
bytes = "1.12.1"
chromiumoxide = "0.9.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
indexmap = "2.14.2"
multer = "3.1.0"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "cookies"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "collation"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
unicode-normalization = "0.1.25"
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util", "full"] }
