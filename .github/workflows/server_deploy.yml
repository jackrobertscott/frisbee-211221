name: Build & Deploy Node Server
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_IMAGE_NAME }}:latest
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_HOST }}
          if_key_exists: replace
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pull the latest image
            docker pull ${{ secrets.DOCKER_IMAGE_NAME }}:latest

            # Parse deployable apps and deploy to test ports
            IFS=',' read -ra APP_ENTRIES <<< "${{ secrets.DEPLOYABLE_APPS }}"
            DEPLOY_SUCCESS=true

            # Create a safe container name prefix by replacing / with -
            CONTAINER_PREFIX=$(echo "${{ secrets.DOCKER_IMAGE_NAME }}" | tr '/' '-')

            for entry in "${APP_ENTRIES[@]}"; do
              app=$(echo $entry | cut -d':' -f1)
              live_port=$(echo $entry | cut -d':' -f2)
              test_port=$((live_port + 1))
              echo "Deploying $app on test port $test_port (live port: $live_port)"
              
              # Always clean up any existing test container
              docker rm -f ${CONTAINER_PREFIX}-${app}-test || true
              
              # Deploy to test port
              docker run -d --name ${CONTAINER_PREFIX}-${app}-test \
                --env-file /root/secrets/${app}.env \
                -p ${test_port}:4000 \
                ${{ secrets.DOCKER_IMAGE_NAME }}:latest
              
              # Wait for container to be ready (increased attempts and wait time)
              APP_READY=false
              for i in {1..20}; do
                STATUS=$(docker exec ${CONTAINER_PREFIX}-${app}-test curl -s -o /dev/null -w "%{http_code}" localhost:4000 || echo 'failed')
                if [ "$STATUS" = "200" ]; then
                  echo "$app is up inside container!"
                  APP_READY=true
                  break
                fi
                echo "Waiting for $app... attempt $i"
                sleep 5
              done
              
              if [ "$APP_READY" = "false" ]; then
                echo "$app failed to respond with 200"
                docker logs ${CONTAINER_PREFIX}-${app}-test
                docker stop ${CONTAINER_PREFIX}-${app}-test
                docker rm -f ${CONTAINER_PREFIX}-${app}-test
                DEPLOY_SUCCESS=false
                # Continue to next app instead of exiting
                continue
              fi
              
              # Promote to live
              echo "Promoting $app to live on port $live_port"
              docker stop ${CONTAINER_PREFIX}-${app}-live || true
              docker rm -f ${CONTAINER_PREFIX}-${app}-live || true
              docker run -d --name ${CONTAINER_PREFIX}-${app}-live \
                --env-file /root/secrets/${app}.env \
                -p ${live_port}:4000 \
                ${{ secrets.DOCKER_IMAGE_NAME }}:latest
              
              # Cleanup test container
              docker stop ${CONTAINER_PREFIX}-${app}-test || true
              docker rm ${CONTAINER_PREFIX}-${app}-test || true
            done

            # Cleanup old images
            docker image prune -af

            # Exit with error if any deployments failed
            if [ "$DEPLOY_SUCCESS" = "false" ]; then
              echo "One or more deployments failed"
              exit 1
            fi
